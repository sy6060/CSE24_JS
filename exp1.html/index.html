<body>
  <div class="card" role="region" aria-label="Student Result Calculator">
    <h1>Student Result Calculator</h1>

    <label for="numSubjects">Enter Number of Subjects</label>
    <input id="numSubjects" type="number" min="1" value="3" aria-describedby="numHelp" />

    <div id="numHelp" class="muted">Set how many subjects you want to enter marks for.</div>

    <button id="calcBtn" type="button">Calculate Result</button>

    <div id="output" class="result" hidden aria-live="polite">
      <div id="summary"></div>
      <div id="details" class="muted"></div>
    </div>
  </div>

  <script src="script.js"></script>
</body>
</html>
