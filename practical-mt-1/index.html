<!DOCTYPE html>
<html>
<head>
  <title>DOM Manipulation Experiment</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <p id="paragraph">sample paragraph</p>

  <script src="script.js"></script>

</html>
